<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const LOGO_URL = "https://i.ibb.co.com/DP0G84Qm/Chat-GPT-Image-Jul-27-2026-05-10-28-PM.png";
        
        const DEFAULT_VILLAGES = [
            "Manggupi", "Womnowi", "Meyof 1", "Saray", "Sidey Baru", "Waramui",
            "Sidey Jaya", "Kaironi", "Sidey Makmur", "Kasi", "Wariki", "Sidey"
        ];

        const Logo = ({ className, alt = "Logo", style = {} }) => {
            const [cleanSrc, setCleanSrc] = useState(LOGO_URL);

            useEffect(() => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.src = LOGO_URL;
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        const w = img.naturalWidth || img.width;
                        const h = img.naturalHeight || img.height;
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        const imageData = ctx.getImageData(0, 0, w, h);
                        const data = imageData.data;

                        const visited = new Uint8Array(w * h);
                        const queue = [];

                        // Menambahkan seluruh piksel tepi luar gambar untuk pemindaian flood-fill
                        for (let x = 0; x < w; x++) {
                            queue.push(x, 0);
                            queue.push(x, h - 1);
                        }
                        for (let y = 0; y < h; y++) {
                            queue.push(0, y);
                            queue.push(w - 1, y);
                        }

                        while (queue.length > 0) {
                            const y = queue.pop();
                            const x = queue.pop();
                            const idx = y * w + x;
                            if (visited[idx]) continue;
                            visited[idx] = 1;

                            const pIdx = idx * 4;
                            const r = data[pIdx];
                            const g = data[pIdx + 1];
                            const b = data[pIdx + 2];

                            // Deteksi pola latar belakang putih & abu-abu terang di luar bingkai logo
                            const isCheckerboard = (r > 150 && g > 150 && b > 150) && 
                                                  (Math.abs(r - g) < 25 && Math.abs(g - b) < 25 && Math.abs(r - b) < 25);

                            if (isCheckerboard) {
                                data[pIdx + 3] = 0; // Transparan

                                if (x > 0) queue.push(x - 1, y);
                                if (x < w - 1) queue.push(x + 1, y);
                                if (y > 0) queue.push(x, y - 1);
                                if (y < h - 1) queue.push(x, y + 1);
                            }
                        }

                        ctx.putImageData(imageData, 0, 0);
                        setCleanSrc(canvas.toDataURL('image/png'));
                    } catch (err) {
                        console.warn("Proses pembersihan latar belakang logo terlewati:", err);
                    }
                };
            }, []);

            return <img src={cleanSrc} alt={alt} className={className} style={style} />;
        };

        const VILLAGES = [
            "Manggupi", "Womnowi", "Meyof 1", "Saray", "Sidey Baru", "Waramui",
            "Sidey Jaya", "Kaironi", "Sidey Makmur", "Kasi", "Wariki", "Sidey"
        ];

        const Toast = ({ message, type, onClose }) => (
            <div className={`fixed bottom-4 right-4 left-4 sm:left-auto sm:max-w-md p-4 rounded-xl shadow-2xl flex items-center justify-between gap-3 animate-slide-up z-[70] ${type === 'error' ? 'bg-rose-600 text-white' : 'bg-emerald-600 text-white'}`}>
                <div className="flex items-center gap-3 overflow-hidden">
                    <i className={`ph-bold ${type === 'error' ? 'ph-warning-circle' : 'ph-check-circle'} text-xl flex-shrink-0`}></i>
                    <p className="text-xs sm:text-sm font-medium leading-tight truncate">{message}</p>
                </div>
                <button onClick={onClose} className="p-1 hover:opacity-80 transition-opacity flex-shrink-0"><i className="ph ph-x text-lg"></i></button>
            </div>
        );

        const ActionModal = ({ title, onClose, children }) => (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-3 sm:p-4 z-50 animate-fade-in overflow-y-auto">
                <div className="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg my-auto overflow-hidden shadow-2xl max-h-[90vh] flex flex-col">
                    <div className="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/90 flex-shrink-0">
                        <h3 className="font-semibold text-white text-sm sm:text-base">{title}</h3>
                        <button onClick={onClose} className="p-1 text-slate-400 hover:text-white transition-colors rounded-lg hover:bg-slate-700"><i className="ph ph-x text-lg"></i></button>
                    </div>
                    <div className="p-4 sm:p-6 overflow-y-auto custom-scrollbar flex-1">
                        {children}
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const [user, setUser] = useState(null);
            const [docs, setDocs] = useState([]);
            const [categories, setCategories] = useState([]);
            const [villages, setVillages] = useState([]);
            
            const [currentView, setCurrentView] = useState('dashboard');
            const [selectedKampung, setSelectedKampung] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            
            // Modal States
            const [isUploadOpen, setUploadOpen] = useState(false);
            const [selectedFile, setSelectedFile] = useState(null);
            const [uploadFileName, setUploadFileName] = useState('');
            const [previewDoc, setPreviewDoc] = useState(null);
            const [toast, setToast] = useState(null);
            
            // Category Management States
            const [isAddCategoryOpen, setAddCategoryOpen] = useState(false);
            const [editCategory, setEditCategory] = useState(null);

            // Village Management States
            const [isAddVillageOpen, setAddVillageOpen] = useState(false);
            const [editVillage, setEditVillage] = useState(null);
            const [showVillagesInMenu, setShowVillagesInMenu] = useState(true);
            
            // Edit & Delete Auth States
            const [authPrompt, setAuthPrompt] = useState(null);
            const [adminPwdInput, setAdminPwdInput] = useState('');
            const [editDoc, setEditDoc] = useState(null);
            const [showAdminPwdInput, setShowAdminPwdInput] = useState(false);
            
            // Print State
            const [printContext, setPrintContext] = useState(null);

            // Auth Input States
            const [loginRole, setLoginRole] = useState('umum');
            const [loginName, setLoginName] = useState('');
            const [loginPwd, setLoginPwd] = useState('');
            const [loginError, setLoginError] = useState('');
            const [showLoginPwd, setShowLoginPwd] = useState(false);

            // PWA Installation
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [showInstallGuide, setShowInstallGuide] = useState(false);

            const showToast = (msg, type = 'success') => {
                setToast({ message: msg, type });
                setTimeout(() => setToast(null), 3500);
            };

            // Catch PWA beforeinstallprompt event
            useEffect(() => {
                const handleBeforeInstallPrompt = (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                };
                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            }, []);

            // Firebase Initialization & Firestore Listeners
            useEffect(() => {
                let unsubscribeDocs = null;
                let unsubscribeCats = null;
                let unsubscribeVillages = null;

                const initDb = async () => {
                    if (!window.FirebaseLib) return;
                    const { initializeApp, getAuth, signInAnonymously, getFirestore, collection, onSnapshot, query, setDoc, doc } = window.FirebaseLib;
                    
                    const firebaseConfig = {
                        apiKey: "AIzaSyBoW3GSpSgQ-DCz8PZHpQmigARek_ImXrs",
                        authDomain: "aplikasi-penyimpanan-dok-d8938.firebaseapp.com",
                        projectId: "aplikasi-penyimpanan-dok-d8938",
                        storageBucket: "aplikasi-penyimpanan-dok-d8938.firebasestorage.app",
                        messagingSenderId: "1010696232229",
                        appId: "1:1010696232229:web:059fd827337d7ce4930ecc",
                        measurementId: "G-M4QSLLGXX9"
                    };

                    try {
                        const app = initializeApp(firebaseConfig);
                        const auth = getAuth(app);
                        const db = getFirestore(app);
                        
                        await signInAnonymously(auth);
                        
                        // Listen to Documents
                        const qDocs = query(collection(db, 'documents'));
                        unsubscribeDocs = onSnapshot(qDocs, (snapshot) => {
                            const data = [];
                            snapshot.forEach(d => data.push({ id: d.id, ...d.data() }));
                            data.sort((a,b) => b.createdAt - a.createdAt);
                            setDocs(data);
                        });

                        // Listen to Categories (Folders)
                        const qCats = query(collection(db, 'categories'));
                        unsubscribeCats = onSnapshot(qCats, async (snapshot) => {
                            if (snapshot.empty) {
                                const DEFAULT_CATEGORIES = [
                                    { id: 'rkpk_apbk', name: 'RKPK / APBK', icon: 'ph-book-bookmark' },
                                    { id: 'perangkat_kampung', name: 'Data Perangkat Kampung', icon: 'ph-users-three' },
                                    { id: 'perangkat_bamuskam', name: 'Data Perangkat Bamuskam', icon: 'ph-users' },
                                    { id: 'dana_desa', name: 'Pelaporan Dana Desa', icon: 'ph-money' },
                                    { id: 'nominatif', name: 'Data Nominatif Kampung', icon: 'ph-file-text' }
                                ];
                                for (let i = 0; i < DEFAULT_CATEGORIES.length; i++) {
                                    const cat = DEFAULT_CATEGORIES[i];
                                    await setDoc(doc(db, 'categories', cat.id), {
                                        name: cat.name,
                                        icon: cat.icon,
                                        createdAt: Date.now() + i
                                    });
                                }
                            } else {
                                const data = [];
                                snapshot.forEach(d => data.push({ id: d.id, ...d.data() }));
                                data.sort((a,b) => a.createdAt - b.createdAt);
                                setCategories(data);
                            }
                        });

                        // Listen to Villages (Kampung)
                        const qVillages = query(collection(db, 'villages'));
                        unsubscribeVillages = onSnapshot(qVillages, async (snapshot) => {
                            if (snapshot.empty) {
                                for (let i = 0; i < DEFAULT_VILLAGES.length; i++) {
                                    const vName = DEFAULT_VILLAGES[i];
                                    await setDoc(doc(db, 'villages', 'v_' + i), {
                                        name: vName,
                                        createdAt: Date.now() + i
                                    });
                                }
                            } else {
                                const data = [];
                                snapshot.forEach(d => data.push({ id: d.id, ...d.data() }));
                                data.sort((a,b) => a.name.localeCompare(b.name));
                                setVillages(data);
                            }
                        });

                    } catch (error) {
                        console.error("Firebase Error:", error);
                    }
                };

                const timer = setInterval(() => {
                    if (window.FirebaseLib) {
                        clearInterval(timer);
                        initDb();
                    }
                }, 100);

                return () => {
                    clearInterval(timer);
                    if (unsubscribeDocs) unsubscribeDocs();
                    if (unsubscribeCats) unsubscribeCats();
                    if (unsubscribeVillages) unsubscribeVillages();
                };
            }, []);

            const handleDownloadApp = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        showToast('Aplikasi berhasil dipasang di perangkat Anda!');
                    }
                    setDeferredPrompt(null);
                } else {
                    setShowInstallGuide(true);
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (!loginName.trim()) return setLoginError('Nama lengkap wajib diisi.');
                if (loginRole === 'admin' && loginPwd !== 'sidey2026') return setLoginError('Kata sandi admin salah!');
                
                setUser({ name: loginName.trim(), role: loginRole });
                setLoginError('');
            };

            const handleLogout = () => {
                setUser(null);
                setLoginName('');
                setLoginPwd('');
                setCurrentView('dashboard');
                setSelectedKampung(null);
                setMobileMenuOpen(false);
            };

            const handleFileSelect = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setSelectedFile(file);
                    setUploadFileName(file.name);
                }
            };

            const handleUpload = async (e) => {
                e.preventDefault();
                
                if (!selectedFile) {
                    showToast('Silakan pilih file dokumen terlebih dahulu!', 'error');
                    return;
                }

                const maxSizeInBytes = 500 * 1024 * 1024;
                if (selectedFile.size > maxSizeInBytes) {
                    showToast('Gagal terupload! Ukuran file melebihi batas 500 MB.', 'error');
                    return;
                }

                const form = e.target;
                const fileSizeMB = (selectedFile.size / (1024 * 1024)).toFixed(2) + ' MB';
                const fileBlobUrl = URL.createObjectURL(selectedFile);

                const newDoc = {
                    name: uploadFileName || form.fileName.value,
                    category: form.category.value,
                    clientName: form.client.value,
                    size: fileSizeMB,
                    status: 'Menunggu',
                    createdAt: Date.now(),
                    uploadedBy: user.name,
                    fileUrl: fileBlobUrl
                };
                
                try {
                    const { getFirestore, collection, addDoc } = window.FirebaseLib;
                    const db = getFirestore();
                    await addDoc(collection(db, 'documents'), newDoc);
                    setUploadOpen(false);
                    setSelectedFile(null);
                    setUploadFileName('');
                    showToast('Dokumen berhasil diunggah dan disimpan!');
                } catch (err) {
                    console.error(err);
                    showToast('Gagal menyimpan dokumen ke database.', 'error');
                }
            };

            const handleVerifyPassword = (e) => {
                e.preventDefault();
                if (adminPwdInput === 'sidey2026') {
                    if (authPrompt.action === 'delete') {
                        executeDelete(authPrompt.data.id);
                        if (previewDoc && previewDoc.id === authPrompt.data.id) setPreviewDoc(null);
                    } else if (authPrompt.action === 'edit') {
                        setEditDoc(authPrompt.data);
                    } else if (authPrompt.action === 'deleteCategory') {
                        executeDeleteCategory(authPrompt.data.id);
                    } else if (authPrompt.action === 'deleteVillage') {
                        executeDeleteVillage(authPrompt.data);
                    }
                    setAuthPrompt(null);
                } else {
                    showToast('Kata sandi Admin salah!', 'error');
                }
                setAdminPwdInput('');
            };

            const executeDeleteVillage = async (village) => {
                const docCount = docs.filter(d => d.clientName === village.name).length;
                if (docCount > 0) {
                    showToast(`Gagal: Masih ada ${docCount} dokumen terkait kampung ${village.name}! Hapus/pindahkan dokumen terlebih dahulu.`, 'error');
                    return;
                }
                try {
                    const { getFirestore, doc, deleteDoc } = window.FirebaseLib;
                    const db = getFirestore();
                    await deleteDoc(doc(db, 'villages', village.id));
                    if (selectedKampung === village.name) setSelectedKampung(null);
                    showToast(`Kampung "${village.name}" berhasil dihapus.`);
                } catch (err) {
                    console.error(err);
                    showToast('Gagal menghapus kampung.', 'error');
                }
            };

            const handleAddVillage = async (e) => {
                e.preventDefault();
                const vName = e.target.villageName.value.trim();
                if (!vName) return;
                
                if (villages.some(v => v.name.toLowerCase() === vName.toLowerCase())) {
                    showToast('Nama kampung sudah ada!', 'error');
                    return;
                }

                try {
                    const { getFirestore, collection, addDoc } = window.FirebaseLib;
                    const db = getFirestore();
                    await addDoc(collection(db, 'villages'), {
                        name: vName,
                        createdAt: Date.now()
                    });
                    setAddVillageOpen(false);
                    showToast(`Kampung "${vName}" berhasil ditambahkan!`);
                } catch (err) {
                    showToast('Gagal menambah kampung.', 'error');
                }
            };

            const handleUpdateVillage = async (e) => {
                e.preventDefault();
                const vName = e.target.villageName.value.trim();
                if (!vName || !editVillage) return;

                try {
                    const { getFirestore, doc, updateDoc } = window.FirebaseLib;
                    const db = getFirestore();
                    await updateDoc(doc(db, 'villages', editVillage.id), {
                        name: vName
                    });
                    setEditVillage(null);
                    showToast('Nama kampung berhasil diperbarui!');
                } catch (err) {
                    showToast('Gagal memperbarui kampung.', 'error');
                }
            };

            const executeDeleteCategory = async (id) => {
                const docCount = docs.filter(d => d.category === id).length;
                if (docCount > 0) {
                    showToast(`Gagal: Folder masih berisi ${docCount} dokumen! Hapus dokumen terlebih dahulu.`, 'error');
                    return;
                }
                try {
                    const { getFirestore, doc, deleteDoc } = window.FirebaseLib;
                    const db = getFirestore();
                    await deleteDoc(doc(db, 'categories', id));
                    if (currentView === id) setCurrentView('dashboard');
                    showToast('Folder berhasil dihapus.');
                } catch (err) {
                    console.error(err);
                    showToast('Gagal menghapus folder.', 'error');
                }
            };

            const executeDelete = async (id) => {
                try {
                    const { getFirestore, doc, deleteDoc } = window.FirebaseLib;
                    const db = getFirestore();
                    await deleteDoc(doc(db, 'documents', id));
                    showToast('Dokumen berhasil dihapus permanen.');
                } catch (err) {
                    console.error(err);
                    showToast('Gagal menghapus dokumen.', 'error');
                }
            };

            const handleUpdateDoc = async (e) => {
                e.preventDefault();
                const form = e.target;
                try {
                    const { getFirestore, doc, updateDoc } = window.FirebaseLib;
                    const db = getFirestore();
                    await updateDoc(doc(db, 'documents', editDoc.id), {
                        name: form.fileName.value,
                        category: form.category.value,
                        clientName: form.client.value
                    });
                    setEditDoc(null);
                    showToast('Data dokumen berhasil diperbarui.');
                } catch (err) {
                    console.error(err);
                    showToast('Gagal memperbarui data.', 'error');
                }
            };

            const handleAddCategory = async (e) => {
                e.preventDefault();
                const form = e.target;
                try {
                    const { getFirestore, collection, addDoc } = window.FirebaseLib;
                    const db = getFirestore();
                    await addDoc(collection(db, 'categories'), {
                        name: form.catName.value,
                        icon: 'ph-folder',
                        createdAt: Date.now()
                    });
                    setAddCategoryOpen(false);
                    showToast('Folder baru berhasil ditambahkan!');
                } catch (err) {
                    showToast('Gagal menambah folder.', 'error');
                }
            };

            const handleUpdateCategory = async (e) => {
                e.preventDefault();
                const form = e.target;
                try {
                    const { getFirestore, doc, updateDoc } = window.FirebaseLib;
                    const db = getFirestore();
                    await updateDoc(doc(db, 'categories', editCategory.id), {
                        name: form.catName.value
                    });
                    setEditCategory(null);
                    showToast('Nama folder berhasil diperbarui!');
                } catch (err) {
                    showToast('Gagal memperbarui folder.', 'error');
                }
            };

            const handleStatusChange = async (id, newStatus) => {
                if (user.role !== 'admin') return;
                try {
                    const { getFirestore, doc, updateDoc } = window.FirebaseLib;
                    const db = getFirestore();
                    await updateDoc(doc(db, 'documents', id), { status: newStatus });
                    setPreviewDoc(prev => prev && prev.id === id ? {...prev, status: newStatus} : prev);
                    showToast(`Status dokumen diubah menjadi ${newStatus}.`);
                } catch (err) {
                    console.error(err);
                    showToast('Gagal mengubah status.', 'error');
                }
            };

            const filteredDocs = useMemo(() => {
                let result = docs;
                if (searchQuery) {
                    const lowerQ = searchQuery.toLowerCase();
                    result = result.filter(d => d.name.toLowerCase().includes(lowerQ) || d.clientName.toLowerCase().includes(lowerQ));
                } else if (currentView !== 'dashboard' && currentView !== 'rekapan') {
                    result = result.filter(d => d.category === currentView);
                    if (selectedKampung) {
                        result = result.filter(d => d.clientName === selectedKampung);
                    }
                }
                return result;
            }, [docs, currentView, selectedKampung, searchQuery]);

            const stats = {
                total: docs.length,
                pending: docs.filter(d => d.status === 'Menunggu').length,
                approved: docs.filter(d => d.status === 'Disetujui').length,
            };

            const formatDate = (ts) => new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(ts));

            // Login Screen View
            if (!user) {

                                        <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-medium rounded-xl shadow-lg shadow-indigo-600/20 transition-all flex items-center gap-1.5">
                                            <i className="ph-bold ph-floppy-disk"></i> Simpan
                                        </button>
                                    </div>
                                </form>
                            </ActionModal>
                        )}

                        {/* Detail Modal */}
                        {previewDoc && (
                            <ActionModal title="Detail Dokumen" onClose={() => setPreviewDoc(null)}>
                                <div className="space-y-4">
                                    <div className="p-3.5 bg-slate-900 rounded-xl border border-slate-700 flex items-start gap-3">
                                        <div className="w-10 h-10 rounded-lg bg-indigo-500/20 flex items-center justify-center flex-shrink-0 border border-indigo-500/30">
                                            <i className="ph-fill ph-file-pdf text-xl text-indigo-400"></i>
                                        </div>
                                        <div className="min-w-0 flex-1">
                                            <h4 className="font-bold text-white text-xs sm:text-sm leading-tight truncate">{previewDoc.name}</h4>
                                            <p className="text-[10px] sm:text-xs text-slate-400 mt-0.5">{previewDoc.size} • {formatDate(previewDoc.createdAt)}</p>
                                        </div>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-2.5">
                                        <div className="p-2.5 bg-slate-800/50 rounded-xl border border-slate-700/50">
                                            <p className="text-[10px] text-slate-500 uppercase font-semibold tracking-wider">Desa</p>
                                            <p className="text-xs sm:text-sm font-medium text-slate-200 truncate">{previewDoc.clientName}</p>
                                        </div>
                                        <div className="p-2.5 bg-slate-800/50 rounded-xl border border-slate-700/50">
                                            <p className="text-[10px] text-slate-500 uppercase font-semibold tracking-wider">Kategori</p>
                                            <p className="text-xs sm:text-sm font-medium text-slate-200 truncate">{categories.find(c=>c.id===previewDoc.category)?.name || previewDoc.category}</p>
                                        </div>
                                        <div className="p-2.5 bg-slate-800/50 rounded-xl border border-slate-700/50">
                                            <p className="text-[10px] text-slate-500 uppercase font-semibold tracking-wider">Pengunggah</p>
                                            <p className="text-xs sm:text-sm font-medium text-slate-200 truncate">{previewDoc.uploadedBy}</p>
                                        </div>
                                        <div className="p-2.5 bg-slate-800/50 rounded-xl border border-slate-700/50">
                                            <p className="text-[10px] text-slate-500 uppercase font-semibold tracking-wider">Status</p>
                                            <span className={`inline-block mt-0.5 px-2 py-0.5 rounded text-[10px] font-bold uppercase ${previewDoc.status === 'Disetujui' ? 'bg-emerald-500/20 text-emerald-400' : previewDoc.status === 'Ditolak' ? 'bg-rose-500/20 text-rose-400' : 'bg-amber-500/20 text-amber-400'}`}>{previewDoc.status}</span>
                                        </div>
                                    </div>

                                    {previewDoc.fileUrl && (
                                        <div className="pt-2">
                                            <a href={previewDoc.fileUrl} download={previewDoc.name} target="_blank" rel="noreferrer" className="w-full py-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-indigo-400 hover:text-indigo-300 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-colors">
                                                <i className="ph-bold ph-download-simple text-base"></i> Unduh File Dokumen
                                            </a>
                                        </div>
                                    )}

                                    {user.role === 'admin' && previewDoc.status === 'Menunggu' && (
                                        <div className="flex gap-2 pt-3 border-t border-slate-700">
                                            <button onClick={() => handleStatusChange(previewDoc.id, 'Disetujui')} className="flex-1 py-2 bg-emerald-500 hover:bg-emerald-400 text-white rounded-xl text-xs font-medium transition-colors flex justify-center items-center gap-1.5">
                                                <i className="ph-bold ph-check"></i> Setujui
                                            </button>
                                            <button onClick={() => handleStatusChange(previewDoc.id, 'Ditolak')} className="flex-1 py-2 bg-rose-500 hover:bg-rose-400 text-white rounded-xl text-xs font-medium transition-colors flex justify-center items-center gap-1.5">
                                                <i className="ph-bold ph-x"></i> Tolak
                                            </button>
                                        </div>
                                    )}

                                    <div className="flex justify-end gap-2 pt-3 border-t border-slate-700">
                                        <button onClick={() => {setPrintContext({type: 'doc', data: previewDoc}); setPreviewDoc(null);}} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-medium rounded-xl flex items-center gap-1.5 transition-colors">
                                            <i className="ph-bold ph-printer"></i> Cetak Struk
                                        </button>
                                    </div>
                                </div>
                            </ActionModal>
                        )}

                        {/* Auth Confirm Modal */}
                        {authPrompt && (
                            <ActionModal title="Otorisasi Admin" onClose={() => { setAuthPrompt(null); setAdminPwdInput(''); setShowAdminPwdInput(false); }}>
                                <form onSubmit={handleVerifyPassword} className="space-y-4">
                                    <div className="p-3 bg-amber-500/10 border border-amber-500/20 rounded-xl flex gap-2.5 text-amber-200 text-xs sm:text-sm">
                                        <i className="ph-fill ph-warning-circle text-lg flex-shrink-0 text-amber-400"></i>
                                        <p>Konfirmasi aksi <b>{authPrompt.action === 'edit' ? 'Edit' : authPrompt.action === 'deleteCategory' ? 'Hapus Folder' : 'Hapus'}</b>. Masukkan password Admin.</p>
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-semibold text-slate-400 mb-1 uppercase">Kata Sandi Admin</label>
                                        <div className="relative">
                                            <i className="ph ph-lock-key absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-base"></i>
                                            <input type={showAdminPwdInput ? "text" : "password"} autoFocus value={adminPwdInput} onChange={e => setAdminPwdInput(e.target.value)} placeholder="Password admin..." className="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-9 py-2.5 text-xs sm:text-sm text-white focus:ring-1 focus:ring-indigo-500 outline-none" required />
                                            <button type="button" onClick={() => setShowAdminPwdInput(!showAdminPwdInput)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
                                                <i className={`ph ${showAdminPwdInput ? 'ph-eye-slash' : 'ph-eye'} text-base`}></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div className="pt-3 border-t border-slate-700 flex justify-end gap-2">
                                        <button type="button" onClick={() => { setAuthPrompt(null); setAdminPwdInput(''); setShowAdminPwdInput(false); }} className="px-4 py-2 text-xs sm:text-sm font-medium text-slate-400 hover:text-white">Batal</button>
                                        <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-medium rounded-xl shadow-lg transition-all">Verifikasi</button>
                                    </div>
                                </form>
                            </ActionModal>
                        )}

                        {/* Edit Modal */}
                        {editDoc && (
                            <ActionModal title="Edit Data Dokumen" onClose={() => setEditDoc(null)}>
                                <form onSubmit={handleUpdateDoc} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-400 mb-1">Nama File Dokumen</label>
                                        <input name="fileName" type="text" defaultValue={editDoc.name} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs sm:text-sm text-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" required />
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-400 mb-1">Kategori</label>
                                            <select name="category" defaultValue={editDoc.category} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs sm:text-sm text-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none">
                                                {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-400 mb-1">Desa / Kampung</label>
                                            <select name="client" required defaultValue={editDoc.clientName} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs sm:text-sm text-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none">
                                                {villages.map(v => <option key={v.id || v.name} value={v.name}>{v.name}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="pt-3 border-t border-slate-700 flex justify-end gap-2">
                                        <button type="button" onClick={() => setEditDoc(null)} className="px-4 py-2 text-xs sm:text-sm font-medium text-slate-400 hover:text-white">Batal</button>
                                        <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-medium rounded-xl shadow-lg transition-all">Simpan</button>
                                    </div>
                                </form>
                            </ActionModal>
                        )}

                        {/* Auth Confirm Modal */}
                        {authPrompt && (
                            <ActionModal title="Otorisasi Admin" onClose={() => { setAuthPrompt(null); setAdminPwdInput(''); setShowAdminPwdInput(false); }}>
                                <form onSubmit={handleVerifyPassword} className="space-y-4">
                                    <div className="p-3 bg-amber-500/10 border border-amber-500/20 rounded-xl flex gap-2.5 text-amber-200 text-xs sm:text-sm">
                                        <i className="ph-fill ph-warning-circle text-lg flex-shrink-0 text-amber-400"></i>
                                        <p>Konfirmasi aksi <b>{authPrompt.action === 'edit' ? 'Edit Dokumen' : authPrompt.action === 'deleteCategory' ? 'Hapus Folder' : authPrompt.action === 'deleteVillage' ? `Hapus Kampung (${authPrompt.data.name})` : 'Hapus Dokumen'}</b>. Masukkan password Admin.</p>
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-semibold text-slate-400 mb-1 uppercase">Kata Sandi Admin</label>
                                        <div className="relative">
                                            <i className="ph ph-lock-key absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-base"></i>
                                            <input type={showAdminPwdInput ? "text" : "password"} autoFocus value={adminPwdInput} onChange={e => setAdminPwdInput(e.target.value)} placeholder="Password admin..." className="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-9 py-2.5 text-xs sm:text-sm text-white focus:ring-1 focus:ring-indigo-500 outline-none" required />
                                            <button type="button" onClick={() => setShowAdminPwdInput(!showAdminPwdInput)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
                                                <i className={`ph ${showAdminPwdInput ? 'ph-eye-slash' : 'ph-eye'} text-base`}></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div className="pt-3 border-t border-slate-700 flex justify-end gap-2">
                                        <button type="button" onClick={() => { setAuthPrompt(null); setAdminPwdInput(''); setShowAdminPwdInput(false); }} className="px-4 py-2 text-xs sm:text-sm font-medium text-slate-400 hover:text-white">Batal</button>
                                        <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-medium rounded-xl shadow-lg transition-all">Verifikasi</button>
                                    </div>
                                </form>
                            </ActionModal>
                        )}

                        {/* Add Village Modal */}
                        {isAddVillageOpen && (
                            <ActionModal title="Tambah Nama Kampung Baru" onClose={() => setAddVillageOpen(false)}>
                                <form onSubmit={handleAddVillage} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-400 mb-1">Nama Kampung / Desa</label>
                                        <input name="villageName" type="text" placeholder="Contoh: Kampung Sidey Makmur..." className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs sm:text-sm text-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" required autoFocus />
                                    </div>
                                    <div className="pt-3 border-t border-slate-700 flex justify-end gap-2">
                                        <button type="button" onClick={() => setAddVillageOpen(false)} className="px-4 py-2 text-xs sm:text-sm font-medium text-slate-400 hover:text-white">Batal</button>
                                        <button type="submit" className="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs sm:text-sm font-medium rounded-xl shadow-lg transition-all flex items-center gap-1.5">
                                            <i className="ph-bold ph-plus"></i> Simpan Kampung
                                        </button>
                                    </div>
                                </form>
                            </ActionModal>
                        )}

                        {/* Edit Village Modal */}
                        {editVillage && (
                            <ActionModal title="Ubah Nama Kampung" onClose={() => setEditVillage(null)}>
                                <form onSubmit={handleUpdateVillage} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-400 mb-1">Nama Kampung</label>
                                        <input name="villageName" type="text" defaultValue={editVillage.name} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs sm:text-sm text-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" required autoFocus />
                                    </div>
                                    <div className="pt-3 border-t border-slate-700 flex justify-end gap-2">
                                        <button type="button" onClick={() => setEditVillage(null)} className="px-4 py-2 text-xs sm:text-sm font-medium text-slate-400 hover:text-white">Batal</button>
                                        <button type="submit" className="px-5 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs sm:text-sm font-medium rounded-xl shadow-lg transition-all flex items-center gap-1.5">
                                            <i className="ph-bold ph-floppy-disk"></i> Simpan Perubahan
                                        </button>
                                    </div>
                                </form>
                            </ActionModal>
                        )}

                        {/* Edit Category Modal */}
                        {editCategory && (
                            <ActionModal title="Ubah Nama Folder" onClose={() => setEditCategory(null)}>
                                <form onSubmit={handleUpdateCategory} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-400 mb-1">Nama Folder Baru</label>
                                        <input name="catName" type="text" defaultValue={editCategory.name} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs sm:text-sm text-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none" required autoFocus />
                                    </div>
                                    <div className="pt-3 border-t border-slate-700 flex justify-end gap-2">
                                        <button type="button" onClick={() => setEditCategory(null)} className="px-4 py-2 text-xs sm:text-sm font-medium text-slate-400 hover:text-white">Batal</button>
                                        <button type="submit" className="px-5 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs sm:text-sm font-medium rounded-xl shadow-lg transition-all flex items-center gap-1.5">
                                            <i className="ph-bold ph-floppy-disk"></i> Simpan Perubahan
                                        </button>
                                    </div>
                                </form>
                            </ActionModal>
                        )}
                        
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
