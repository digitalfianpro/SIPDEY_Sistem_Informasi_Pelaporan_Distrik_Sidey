            const handleLogin = (e) => {
                e.preventDefault();
                setError('');

                setTimeout(() => {
                    if (loginMode === 'admin') {
                        if (username.trim() !== '' && password === 'sidey2026') {
                            onLogin('admin', username);
                        } else if (username.trim() === '') {
                            setError('Username wajib diisi!');
                            setIsLoading(false);
                        } else {
                            setError('Password Admin salah!');

            const handleDownloadApp = () => {

                    <div className="mb-8 md:mb-10 flex flex-col items-center z-10 animate-slide-up">

                            <button

                        {error && (

                                        placeholder={loginMode === 'admin' ? "Masukkan username" : "Contoh: Budi Santoso"} 
                                        required

                            {loginMode === 'admin' && (

                            <button 
                                type="submit" 
                                disabled={isLoading}
                                className={`w-full ${loginMode === 'admin' ? 'bg-purple-600 hover:bg-purple-500 shadow-purple-600/20' : 'bg-emerald-600 hover:bg-emerald-500 shadow-emerald-600/20'} text-white font-bold rounded-xl py-3 md:py-3.5 transition-all shadow-lg flex justify-center items-center gap-2 mt-2 md:mt-4 outline-none ${isLoading ? 'opacity-80 cursor-wait' : ''}`}
                            >
                                {isLoading ? (
                                    <><i className="ph ph-spinner-gap animate-spin text-xl"></i> Memproses...</>
                                ) : (

                            <button 
                                type="button" 
                                onClick={handleDownloadApp}
                                disabled={isDownloading}
                                className={`w-full bg-[#1e293b] hover:bg-brand-primary text-slate-300 hover:text-white font-semibold rounded-xl py-2.5 md:py-3 transition-all shadow-md flex justify-center items-center gap-2 mt-2 border border-slate-700 focus:outline-none ${isDownloading ? 'opacity-80 cursor-wait' : ''}`}
                            >

        };

        const DashboardApp = ({ onLogout, userRole, userName }) => {
            const [activeMenu, setActiveMenu] = useState('dashboard');
            const [isKampungExpanded, setIsKampungExpanded] = useState(true);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [isFirebaseLoading, setIsFirebaseLoading] = useState(true);
            
            const [uploadCat, setUploadCat] = useState('');
            const [uploadVillage, setUploadVillage] = useState('');
            const [uploadError, setUploadError] = useState('');
            const [uploadProgress, setUploadProgress] = useState(0);
            const [isUploading, setIsUploading] = useState(false);

            const [actionPassword, setActionPassword] = useState('');
            const [actionError, setActionError] = useState('');
            const [editDocName, setEditDocName] = useState('');
            
            const [categories, setCategories] = useState(INITIAL_CATEGORIES);
            const [docs, setDocs] = useState([]);
            const [villages, setVillages] = useState(DEFAULT_VILLAGES);

            const [searchTerm, setSearchTerm] = useState('');
            const [rekapanSearch, setRekapanSearch] = useState('');
            const [modalConfig, setModalConfig] = useState({ type: null, data: null });
            const [printMode, setPrintMode] = useState(null);
            const [catInput, setCatInput] = useState('');
            const [isLightMode, setIsLightMode] = useState(false);
            
            const ADMIN_PASSWORD = 'sidey2026';

            const [districtInfo, setDistrictInfo] = useState({
                headName: 'NAMA KEPALA DISTRIK',
                headNip: '19700101 200001 1 001',
                address: 'Jalan Raya Sidey, Kode Pos 98314, Provinsi Papua Barat',
                logoUrl: LOGO_URL
            });
            const [villageInput, setVillageInput] = useState('');
            const [settingsInput, setSettingsInput] = useState(districtInfo);

            useEffect(() => {
                if (isLightMode) { document.body.classList.add('light-mode'); } 
                else { document.body.classList.remove('light-mode'); }
            }, [isLightMode]);

            useEffect(() => {
                if (!window.firebaseReady) return;

                window.firebaseReady.then((success) => {
                    if(!success) {
                        setDocs([]); setIsFirebaseLoading(false); return;
                    }
                    
                    const { db, fsOps } = window;
                    
                    // Listener realtime untuk Dokumen
                    const docsRef = fsOps.collection(db, 'sipdey_docs');
                    const unsubscribeDocs = fsOps.onSnapshot(docsRef, (snapshot) => {
                        const loadedDocs = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        setDocs(loadedDocs.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0)));
                        setIsFirebaseLoading(false);
                    }, (err) => {
                        console.error("Gagal memuat dokumen", err);
                        setIsFirebaseLoading(false);
                    });

                    // Listener realtime untuk Kategori
                    const catRef = fsOps.collection(db, 'sipdey_categories');
                    const unsubscribeCat = fsOps.onSnapshot(catRef, (snapshot) => {
                        if (!snapshot.empty) {
                            const loadedCats = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setCategories(loadedCats);
                        } else {
                            // Inisialisasi awal ke Firebase jika kosong
                            INITIAL_CATEGORIES.forEach(cat => fsOps.setDoc(fsOps.doc(db, 'sipdey_categories', cat.id), cat));
                        }
                    });

                    // Listener realtime untuk Desa
                    const vilRef = fsOps.collection(db, 'sipdey_villages');
                    const unsubscribeVil = fsOps.onSnapshot(vilRef, (snapshot) => {
                        if (!snapshot.empty) {
                            const loadedVils = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setVillages(loadedVils);
                        } else {
                            DEFAULT_VILLAGES.forEach(v => fsOps.setDoc(fsOps.doc(db, 'sipdey_villages', v.id), v));
                        }
                    });

                    return () => {
                        unsubscribeDocs();
                        unsubscribeCat();
                        unsubscribeVil();
                    };
                });
            }, []);

            useEffect(() => {
                const handleResize = () => { if(window.innerWidth > 768) setIsMobileMenuOpen(false); };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);
            
            const closeMobileMenu = () => setIsMobileMenuOpen(false);

            const triggerPrint = (mode, data = null) => {
                setPrintMode({ type: mode, data });
                setTimeout(() => window.print(), 500); 
            };

            const handleDownload = async (doc) => {
                if (!doc.fileUrl) return;
                
                // Jika dari firebase storage, kita bisa fetch blobbnya atau langsung buka di tab baru
                try {
                    const response = await fetch(doc.fileUrl);
                    const blob = await response.blob();
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = doc.name;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (e) {
                    // Fallback jika diblokir CORS browser
                    window.open(doc.fileUrl, '_blank');
                }
            };

            const handleSaveCategory = async (e) => {
                e.preventDefault();
                if (modalConfig.type === 'edit' && actionPassword !== ADMIN_PASSWORD) {
                    setActionError('Password konfirmasi salah!'); return;
                }
                if (!catInput.trim() && modalConfig.type !== 'delete') return;

                const { db, fsOps } = window;
                if (modalConfig.type === 'add') {
                    const newId = 'c' + (new Date().getTime());
                    await fsOps.setDoc(fsOps.doc(db, 'sipdey_categories', newId), { id: newId, name: catInput });
                } else if (modalConfig.type === 'edit') {

                    await fsOps.deleteDoc(fsOps.doc(db, 'sipdey_docs', modalConfig.data.id));

                    const uploadTask = fsOps.uploadBytesResumable(storageRef, file);

                    uploadTask.on('state_changed',

                            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                            setUploadProgress(progress);
                        },
                        (error) => {
                            setUploadError('Gagal mengunggah ke cloud.');
                            setIsUploading(false);
                        },

                                    <i className="ph-bold ph-x text-xl"></i>
                                </button>
                                
                                {/* Modal: Upload Cloud */}
                                {modalConfig.type === 'upload' && (
                                    <form onSubmit={handleUploadSubmit}>
                                        <h3 className="text-xl font-bold text-white mb-6">Unggah ke Cloud</h3>
                                        <div className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-medium text-slate-400 mb-2 uppercase">File Dokumen (Max 500MB)</label>
                                                <input type="file" onChange={handleFileChange} required className="w-full text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-brand-primary/10 file:text-brand-primary hover:file:bg-brand-primary hover:file:text-white transition-colors" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-slate-400 mb-2 uppercase">Kategori</label>
                                                <select value={uploadCat} onChange={e => setUploadCat(e.target.value)} required className="w-full bg-[#131b2d] border border-slate-700/50 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-primary">
                                                    <option value="">Pilih Kategori...</option>
                                                    {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-slate-400 mb-2 uppercase">Desa</label>
                                                <select value={uploadVillage} onChange={e => setUploadVillage(e.target.value)} required className="w-full bg-[#131b2d] border border-slate-700/50 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-primary">
                                                    <option value="">Pilih Desa...</option>
                                                    {villages.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                        {uploadError && <p className="text-rose-400 text-xs mt-3">{uploadError}</p>}
                                        {isUploading && (
                                            <div className="mt-4">
                                                <div className="h-2 w-full bg-slate-800 rounded-full overflow-hidden">
                                                    <div className="h-full bg-brand-primary transition-all duration-300" style={{width: `${uploadProgress}%`}}></div>
                                                </div>
                                                <p className="text-center text-xs text-brand-primary mt-1">Mengunggah {Math.round(uploadProgress)}%</p>
                                            </div>
                                        )}
                                        <button type="submit" disabled={isUploading} className={`w-full mt-6 bg-brand-primary hover:bg-indigo-500 text-white font-bold rounded-xl py-3 transition-colors ${isUploading ? 'opacity-50' : ''}`}>
                                            {isUploading ? 'Menyimpan...' : 'Simpan ke Cloud'}
                                        </button>
                                    </form>
                                )}

                                {/* Modal: Hapus Dokumen Cloud */}
                                {modalConfig.type === 'delete_doc' && (
                                    <form onSubmit={handleDeleteDocument}>
                                        <div className="text-center mb-6">
                                            <div className="w-16 h-16 bg-rose-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-rose-500/20">
                                                <i className="ph-fill ph-warning-circle text-3xl text-rose-500"></i>
                                            </div>
                                            <h3 className="text-xl font-bold text-white">Hapus Permanen?</h3>
                                            <p className="text-sm text-slate-400 mt-2">Anda akan menghapus "{modalConfig.data.name}" selamanya dari server Cloud Firebase.</p>
                                        </div>
                                        <input type="password" placeholder="Password Admin (sidey2026)" value={actionPassword} onChange={e => setActionPassword(e.target.value)} required className="w-full bg-[#131b2d] border border-slate-700/50 rounded-xl px-4 py-3 text-sm text-white mb-4 focus:outline-none focus:border-rose-500" />
                                        {actionError && <p className="text-rose-400 text-xs mb-4 text-center">{actionError}</p>}
                                        <button type="submit" className="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl py-3 transition-colors shadow-lg shadow-rose-600/20">Konfirmasi Hapus</button>
                                    </form>
                                )}

                                {/* Modal lainnya (Kategori/Desa) */}
                                {(modalConfig.type === 'add' || modalConfig.type === 'edit') && (
                                    <form onSubmit={handleSaveCategory}>
                                        <h3 className="text-xl font-bold text-white mb-6">{modalConfig.type === 'add' ? 'Tambah' : 'Edit'} Kategori</h3>
                                        <input type="text" placeholder="Nama Kategori" value={catInput} onChange={e => setCatInput(e.target.value)} required className="w-full bg-[#131b2d] border border-slate-700/50 rounded-xl px-4 py-3 text-sm text-white mb-4 focus:outline-none focus:border-brand-primary" />
                                        {modalConfig.type === 'edit' && (
                                            <input type="password" placeholder="Password Admin (sidey2026)" value={actionPassword} onChange={e => setActionPassword(e.target.value)} required className="w-full bg-[#131b2d] border border-slate-700/50 rounded-xl px-4 py-3 text-sm text-white mb-4 focus:outline-none focus:border-brand-primary" />
                                        )}
                                        {actionError && <p className="text-rose-400 text-xs mb-4">{actionError}</p>}
                                        <button type="submit" className="w-full bg-brand-primary hover:bg-indigo-500 text-white font-bold rounded-xl py-3 transition-colors">Simpan Kategori</button>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [userRole, setUserRole] = useState(null);
            const [userName, setUserName] = useState(null);

            const handleLogin = (role, name) => {
                setUserRole(role);
                setUserName(name);
                setIsLoggedIn(true);
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setUserRole(null);
                setUserName(null);
            };

            return isLoggedIn ? (
                <DashboardApp onLogout={handleLogout} userRole={userRole} userName={userName} />
            ) : (
                <LoginScreen onLogin={handleLogin} />
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
