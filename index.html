<body>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="hidden flex h-[100dvh] w-full">

        <!-- Sidebar -->

                <div>

            <div class="flex-1 overflow-y-auto px-4 py-6 space-y-6 custom-scrollbar">

                    <button data-menu="rekapan" class="menu-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors mt-1 text-slate-400 hover:text-slate-200 hover:bg-brand-hover">

                <div>

                </div>
                <div class="flex gap-2">

    <!-- Modals Container -->

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const defaultConfig = {
            apiKey: "AIzaSyAJPS3YlQ7Zbvsim-G6r0xk6aNlTyUMu4A",
            authDomain: "sipdey-69c1d.firebaseapp.com",
            projectId: "sipdey-69c1d",
            storageBucket: "sipdey-69c1d.firebasestorage.app",
            messagingSenderId: "448501424837",
            appId: "1:448501424837:web:541ed1988bcf386edb06ac",
            measurementId: "G-7W2X7JXNR4"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : defaultConfig;
        const appId = typeof __app_id !== 'undefined' ? __app_id : "sipdey-69c1d";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);
        const ADMIN_PASSWORD = 'sidey2026';

        // Initial Data Configurations
        const INITIAL_CATEGORIES = [
            { name: 'RKPK / APBK' }, { name: 'Data Perangkat Kampung' },
            { name: 'Data Perangkat Bamuskam' }, { name: 'Pelaporan Dana Desa' },
            { name: 'Data Nominatif Kampung' }
        ];

        const DEFAULT_VILLAGES = [
            { name: "Kaironi" }, { name: "Kasi" }, { name: "Manggupi" },
            { name: "Meyof 1" }, { name: "Saray" }, { name: "Sidey" },
            { name: "Sidey Baru" }, { name: "Sidey Jaya" }, { name: "Sidey Makmur" },
            { name: "Waramui" }, { name: "Wariki" }, { name: "Womnowi" }
        ];

        // Application State
        const state = {
            userRole: null,
            loginMode: 'umum',
            activeMenu: 'dashboard',
            categories: [],
            villages: [],
            docs: [],
            searchTerm: '',
            isKampungExpanded: true,
            isLightMode: false,
            modalConfig: { type: null, data: null },
            isUploading: false
        };

        // Utility: Escape HTML to prevent basic issues
        const escapeHTML = (str) => {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        };

        // DOM Elements
        const els = {
            loading: document.getElementById('loading-screen'),
            login: document.getElementById('login-screen'),
            dashboard: document.getElementById('dashboard-screen'),
            
            // Login
            tabUmum: document.getElementById('tab-login-umum'),
            tabAdmin: document.getElementById('tab-login-admin'),
            loginError: document.getElementById('login-error'),
            loginForm: document.getElementById('login-form'),
            loginLabelUser: document.getElementById('login-label-username'),
            loginInputUser: document.getElementById('login-input-username'),
            loginPassContainer: document.getElementById('login-password-container'),
            loginInputPass: document.getElementById('login-input-password'),
            loginSubmitBtn: document.getElementById('login-submit-btn'),

            // Sidebar & Main
            sidebar: document.getElementById('sidebar'),
            mobileOverlay: document.getElementById('mobile-overlay'),
            btnCloseSidebar: document.getElementById('btn-close-sidebar'),
            btnMobileMenu: document.getElementById('btn-mobile-menu'),
            sidebarCats: document.getElementById('sidebar-categories'),
            sidebarVils: document.getElementById('sidebar-villages'),
            btnToggleKampung: document.getElementById('btn-toggle-kampung'),
            kampungToggleIcon: document.getElementById('kampung-toggle-icon'),
            kampungCountLabel: document.getElementById('kampung-count-label'),
            btnAddCat: document.getElementById('btn-add-cat'),
            btnAddVil: document.getElementById('btn-add-vil'),
            btnLogout: document.getElementById('btn-logout'),

            // Content
            contentArea: document.getElementById('content-area'),
            searchInput: document.getElementById('search-input'),
            btnRefresh: document.getElementById('btn-refresh'),
            btnThemeToggle: document.getElementById('btn-theme-toggle'),
            themeIcon: document.getElementById('theme-icon'),

            // Modal
            modalContainer: document.getElementById('modal-container'),
            modalContent: document.getElementById('modal-content')
        };

        // Init Auth & Start Listeners
        async function initApp() {
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.warn("Auth error (melanjutkan tanpa auth):", e);
                // Tetap lanjut meskipun auth gagal agar UI tetap terbuka
            }
            
            try {
                setupFirebaseListeners();
            } catch (e) {
                console.error("Listener error:", e);
            }
            
            els.loading.classList.add('hidden');
            els.login.classList.remove('hidden');
            els.login.classList.add('flex');
        }

        function setupFirebaseListeners() {
            // Categories
            const catRef = collection(db, 'artifacts', appId, 'public', 'data', 'categories');
            onSnapshot(catRef, (snapshot) => {
                if (snapshot.empty) {
                    INITIAL_CATEGORIES.forEach(c => addDoc(catRef, c).catch(console.warn));
                } else {
                    state.categories = [];
                    snapshot.forEach(doc => state.categories.push({ id: doc.id, ...doc.data() }));
                    state.categories.sort((a, b) => a.name.localeCompare(b.name));
                    if (state.userRole) { renderSidebar(); renderContent(); }
                }
            }, (error) => {
                console.warn("Firestore categories error, menggunakan data default:", error);
                state.categories = INITIAL_CATEGORIES.map((c, i) => ({id: 'cat'+i, ...c}));
                if (state.userRole) { renderSidebar(); renderContent(); }
            });

            // Villages
            const vilRef = collection(db, 'artifacts', appId, 'public', 'data', 'villages');
            onSnapshot(vilRef, (snapshot) => {
                if (snapshot.empty) {
                    DEFAULT_VILLAGES.forEach(v => addDoc(vilRef, v).catch(console.warn));
                } else {
                    state.villages = [];
                    snapshot.forEach(doc => state.villages.push({ id: doc.id, ...doc.data() }));
                    state.villages.sort((a, b) => a.name.localeCompare(b.name));
                    if (state.userRole) { renderSidebar(); renderContent(); }
                }
            }, (error) => {
                console.warn("Firestore villages error, menggunakan data default:", error);
                state.villages = DEFAULT_VILLAGES.map((v, i) => ({id: 'vil'+i, ...v}));
                if (state.userRole) { renderSidebar(); renderContent(); }
            });

            // Documents
            const docsRef = collection(db, 'artifacts', appId, 'public', 'data', 'documents');
            onSnapshot(docsRef, (snapshot) => {
                state.docs = [];
                snapshot.forEach(doc => state.docs.push({ id: doc.id, ...doc.data() }));
                state.docs.reverse(); // Newest first
                if (state.userRole) {
                    renderSidebar(); // Update sidebar counts
                    renderContent(); // Update main content
                }
            }, (error) => {
                console.warn("Firestore docs error:", error);
                if (state.userRole) {
                    renderSidebar();
                    renderContent();
                }
            });
        }

        // Event Listeners: Login
        els.tabUmum.addEventListener('click', () => switchLoginMode('umum'));
        els.tabAdmin.addEventListener('click', () => switchLoginMode('admin'));

        function switchLoginMode(mode) {
            state.loginMode = mode;
            els.loginError.classList.add('hidden');
            els.loginInputUser.value = '';
            els.loginInputPass.value = '';
            
            if (mode === 'umum') {
                els.tabUmum.className = 'flex-1 py-2 md:py-2.5 text-xs md:text-sm font-medium rounded-lg transition-all flex items-center justify-center gap-2 bg-emerald-600/90 text-white shadow-md';
                els.tabAdmin.className = 'flex-1 py-2 md:py-2.5 text-xs md:text-sm font-medium rounded-lg transition-all flex items-center justify-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800';
                els.loginLabelUser.innerText = 'Nama Lengkap';
                els.loginInputUser.placeholder = 'Contoh: Budi Santoso';
                els.loginPassContainer.classList.add('hidden');
                els.loginInputPass.removeAttribute('required');
                els.loginSubmitBtn.className = 'w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl py-3 transition-all shadow-lg flex justify-center items-center gap-2 mt-2 outline-none';
            } else {
                els.tabAdmin.className = 'flex-1 py-2 md:py-2.5 text-xs md:text-sm font-medium rounded-lg transition-all flex items-center justify-center gap-2 bg-purple-600/90 text-white shadow-md';
                els.tabUmum.className = 'flex-1 py-2 md:py-2.5 text-xs md:text-sm font-medium rounded-lg transition-all flex items-center justify-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800';
                els.loginLabelUser.innerText = 'Username';
                els.loginInputUser.placeholder = 'Masukkan username';
                els.loginPassContainer.classList.remove('hidden');
                els.loginInputPass.setAttribute('required', 'true');
                els.loginSubmitBtn.className = 'w-full bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl py-3 transition-all shadow-lg flex justify-center items-center gap-2 mt-2 outline-none';
            }
        }

        els.loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            els.loginError.classList.add('hidden');
            const username = els.loginInputUser.value.trim();
            const password = els.loginInputPass.value;

            // Simulate loading
            els.loginSubmitBtn.innerHTML = `<i class="ph ph-spinner-gap animate-spin text-xl"></i> Memproses...`;
            els.loginSubmitBtn.disabled = true;

            setTimeout(() => {
                els.loginSubmitBtn.disabled = false;
                els.loginSubmitBtn.innerHTML = `<span>Masuk</span> <i class="ph-bold ph-sign-in text-lg"></i>`;
                
                if (state.loginMode === 'admin') {
                    if (username !== '' && password === ADMIN_PASSWORD) {
                        doLogin('admin');
                    } else {
                        showLoginError('Username atau Password Admin salah!');
                    }
                } else {
                    if (username !== '') {
                        doLogin('umum');
                    } else {
                        showLoginError('Nama Lengkap wajib diisi!');
                    }
                }
            }, 800);
        });

        function showLoginError(msg) {
            els.loginError.innerText = msg;
            els.loginError.classList.remove('hidden');
        }

        function doLogin(role) {
            state.userRole = role;
            els.login.classList.add('hidden');
            els.login.classList.remove('flex');
            els.dashboard.classList.remove('hidden');
            
            if (role === 'admin') {
                els.btnAddCat.classList.remove('hidden');
                els.btnAddVil.classList.remove('hidden');
            } else {
                els.btnAddCat.classList.add('hidden');
                els.btnAddVil.classList.add('hidden');
            }
            
            renderSidebar();
            renderContent();
        }

        // Event Listeners: General UI
        els.btnLogout.addEventListener('click', () => {
            state.userRole = null;
            els.dashboard.classList.add('hidden');
            els.login.classList.remove('hidden');
            els.login.classList.add('flex');
            els.loginInputUser.value = '';
            els.loginInputPass.value = '';
        });

        const toggleMobileMenu = () => {
            els.sidebar.classList.toggle('-translate-x-full');
            els.mobileOverlay.classList.toggle('hidden');
        };
        els.btnMobileMenu.addEventListener('click', toggleMobileMenu);
        els.btnCloseSidebar.addEventListener('click', toggleMobileMenu);
        els.mobileOverlay.addEventListener('click', toggleMobileMenu);

        els.btnRefresh.addEventListener('click', () => {
            // Efek putar saat diklik
            const icon = els.btnRefresh.querySelector('i');
            icon.classList.add('animate-spin');
            setTimeout(() => icon.classList.remove('animate-spin'), 500);

            // Reset ke tampilan Dashboard dan bersihkan pencarian
            state.activeMenu = 'dashboard';
            state.searchTerm = '';
            els.searchInput.value = '';
            
            renderSidebar();
            renderContent();
        });

        els.btnThemeToggle.addEventListener('click', () => {
            state.isLightMode = !state.isLightMode;
            if (state.isLightMode) {
                document.body.classList.add('light-mode');
                els.themeIcon.className = 'ph-bold ph-moon text-lg';
            } else {
                document.body.classList.remove('light-mode');
                els.themeIcon.className = 'ph-bold ph-sun text-lg';
            }
        });

        els.btnToggleKampung.addEventListener('click', () => {
            state.isKampungExpanded = !state.isKampungExpanded;
            els.kampungToggleIcon.className = state.isKampungExpanded ? 'ph-bold ph-caret-down' : 'ph-bold ph-caret-right';
            renderSidebar();
        });

        els.searchInput.addEventListener('input', (e) => {
            state.searchTerm = e.target.value;
            renderContent();
        });

        // Event Listeners: Dynamic Actions via Event Delegation
        document.addEventListener('click', (e) => {
            // Sidebar Menu Clicks
            const menuBtn = e.target.closest('.menu-btn');
            if (menuBtn) {
                state.activeMenu = menuBtn.getAttribute('data-menu');
                if (!els.sidebar.classList.contains('-translate-x-full') && window.innerWidth < 768) {
                    toggleMobileMenu(); // Auto close on mobile
                }
                renderSidebar();
                renderContent();
                return;
            }

            // Folder Grid Clicks
            const folderCard = e.target.closest('.folder-card');
            if (folderCard) {
                state.activeMenu = folderCard.getAttribute('data-menu');
                renderSidebar();
                renderContent();
                return;
            }

            // Action Buttons
            if (e.target.closest('#btn-add-cat')) openModal('add_cat');
            if (e.target.closest('#btn-add-vil')) openModal('add_village');
            if (e.target.closest('#btn-upload')) openModal('upload');
            if (e.target.closest('.btn-close-modal')) closeModal();

            // Print Rekapan Action
            const printBtn = e.target.closest('#btn-print-rekapan');
            if (printBtn) {
                e.preventDefault();
                const originalContent = printBtn.innerHTML;
                printBtn.innerHTML = `<i class="ph-bold ph-spinner animate-spin text-lg"></i> Menyiapkan...`;
                printBtn.disabled = true;
                
                setTimeout(() => {
                    printBtn.innerHTML = originalContent;
                    printBtn.disabled = false;
                    window.print();
                }, 600); // Beri sedikit jeda agar UI sempat merender sebelum dialog print muncul
            }

            // Admin Item Actions (Edit/Delete Category)
            const editCatBtn = e.target.closest('.btn-edit-cat');
            if (editCatBtn) { e.stopPropagation(); openModal('edit_cat', { id: editCatBtn.dataset.id, name: editCatBtn.dataset.name }); }
            
            const delCatBtn = e.target.closest('.btn-delete-cat');
            if (delCatBtn) { e.stopPropagation(); openModal('delete_cat', { id: delCatBtn.dataset.id, name: delCatBtn.dataset.name }); }

            // Document Actions
            const previewDoc = e.target.closest('.btn-preview-doc');
            if (previewDoc) {
                const docData = state.docs.find(d => d.id === previewDoc.dataset.id);
                openModal('preview_doc', docData);
            }
            const editDoc = e.target.closest('.btn-edit-doc');
            if (editDoc) {
                const docData = state.docs.find(d => d.id === editDoc.dataset.id);
                openModal('edit_doc', docData);
            }
            const approveDoc = e.target.closest('.btn-approve-doc');
            if (approveDoc) {
                const docData = state.docs.find(d => d.id === approveDoc.dataset.id);
                openModal('approve_doc', docData);
            }
            const delDoc = e.target.closest('.btn-delete-doc');
            if (delDoc) {
                const docData = state.docs.find(d => d.id === delDoc.dataset.id);
                openModal('delete_doc', docData);
            }
        });

        function renderSidebar() {
            // Update Active States for static buttons
            document.querySelectorAll('.menu-btn[data-menu="dashboard"], .menu-btn[data-menu="rekapan"]').forEach(btn => {
                const menu = btn.getAttribute('data-menu');
                if (state.activeMenu === menu) {
                    btn.className = `menu-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors bg-brand-active text-brand-primary font-medium`;
                    btn.querySelector('i').classList.add('text-brand-primary');
                } else {
                    btn.className = `menu-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors mt-1 text-slate-400 hover:text-slate-200 hover:bg-brand-hover`;
                    btn.querySelector('i').classList.remove('text-brand-primary');
                }
            });

            // Render Categories
            let catHTML = '';
            state.categories.forEach(cat => {
                const isActive = state.activeMenu === 'c_' + cat.id || state.activeMenu.startsWith(`cv_${cat.id}_`);
                const activeClass = isActive ? 'bg-brand-active text-white' : 'text-slate-400 hover:text-slate-200 hover:bg-brand-hover';
                
                let adminActions = '';
                if (state.userRole === 'admin') {
                    adminActions = `
                        <div class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center gap-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity bg-[#1e293b] p-1 rounded shadow-lg">
                            <button data-id="${cat.id}" data-name="${escapeHTML(cat.name)}" class="btn-edit-cat text-slate-400 hover:text-brand-primary p-0.5"><i class="ph-fill ph-pencil-simple text-xs"></i></button>
                            <button data-id="${cat.id}" data-name="${escapeHTML(cat.name)}" class="btn-delete-cat text-slate-400 hover:text-rose-400 p-0.5"><i class="ph-fill ph-trash text-xs"></i></button>
                        </div>
                    `;
                }

                catHTML += `
                    <div class="relative group">
                        <button data-menu="c_${cat.id}" class="menu-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors ${activeClass}">
                            <span class="truncate text-left pr-10">${escapeHTML(cat.name)}</span>
                        </button>
                        ${adminActions}
                    </div>
                `;
            });
            els.sidebarCats.innerHTML = catHTML;

            // Render Villages
            els.kampungCountLabel.innerText = `Daftar Kampung (${state.villages.length})`;
            let vilHTML = '';
            if (state.isKampungExpanded) {
                state.villages.forEach(village => {
                    const isActive = state.activeMenu === 'v_' + village.id;
                    const activeClass = isActive ? 'bg-brand-active text-white' : 'text-slate-400 hover:text-slate-200 hover:bg-brand-hover';
                    vilHTML += `
                        <button data-menu="v_${village.id}" class="menu-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors ${activeClass}">
                            <i class="ph ph-house text-lg opacity-70"></i> <span class="truncate">${escapeHTML(village.name)}</span>
                        </button>
                    `;
                });
            }
            els.sidebarVils.innerHTML = vilHTML;
        }

        function renderContent() {
            const term = state.searchTerm.toLowerCase();
            let filteredDocs = state.docs.filter(doc => doc.name.toLowerCase().includes(term));
            
            if (state.activeMenu.startsWith('cv_')) {
                const parts = state.activeMenu.split('_');
                filteredDocs = filteredDocs.filter(d => d.categoryId === parts[1] && d.villageId === parts[2]);
            } else if (state.activeMenu.startsWith('c_')) {
                const catId = state.activeMenu.substring(2);
                filteredDocs = filteredDocs.filter(d => d.categoryId === catId);
            } else if (state.activeMenu.startsWith('v_')) {
                const vilId = state.activeMenu.substring(2);
                filteredDocs = filteredDocs.filter(d => d.villageId === vilId);
            }

            if (state.activeMenu === 'dashboard') {
                els.contentArea.innerHTML = getDashboardHTML();
            } else if (state.activeMenu === 'rekapan') {
                els.contentArea.innerHTML = getRekapanHTML();
            } else {
                els.contentArea.innerHTML = getHeaderContentHTML() + 
                    ((state.activeMenu.startsWith('c_') && !state.activeMenu.startsWith('cv_')) ? getFolderGridHTML() : getDocTableHTML(filteredDocs));
            }
        }

        function getMainTitle() {
            if (state.activeMenu.startsWith('c_')) {
                const catId = state.activeMenu.substring(2);
                return state.categories.find(c => c.id === catId)?.name || 'Kategori';
            }
            if (state.activeMenu.startsWith('v_')) {
                const vilId = state.activeMenu.substring(2);
                return state.villages.find(v => v.id === vilId)?.name || 'Desa';
            }
            if (state.activeMenu.startsWith('cv_')) {
                const parts = state.activeMenu.split('_');
                const catName = state.categories.find(c => c.id === parts[1])?.name || '';
                const vilName = state.villages.find(v => v.id === parts[2])?.name || '';
                return `${catName} - ${vilName}`;
            }
            return 'Dokumen';
        }

                        </td>
                        <td class="py-4 text-sm text-slate-400">${escapeHTML(state.villages.find(v => v.id === doc.villageId)?.name || '-')}</td>

            return `

                                <h3 class="text-slate-400 font-medium text-sm">Total Dokumen</h3>

                            </div>

        function getFolderGridHTML() {
            const currentCatId = state.activeMenu.substring(2);
            let gridHTML = state.villages.map(village => {
                const fileCount = state.docs.filter(d => d.categoryId === currentCatId && d.villageId === village.id).length;
                return `
                    <div data-menu="cv_${currentCatId}_${village.id}" class="folder-card bg-[#1c2438] border border-slate-700/30 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-800/80 shadow-sm group transition-transform hover:-translate-y-1">
                        <i class="ph-fill ph-folder text-5xl text-[#818cf8] mb-4 group-hover:scale-110 transition-transform"></i>
                        <h3 class="text-white font-bold text-[15px] mb-2 text-center">${escapeHTML(village.name)}</h3>
                        <div class="bg-[#131b2d] border border-slate-700/50 px-3 py-1 rounded-full text-xs text-slate-400 font-medium">${fileCount} File Fisik</div>
                    </div>
                `;
            }).join('');
            
            return `<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">${gridHTML}</div></div>`; // closes max-w-6xl
        }

        function getDocTableHTML(filteredDocs) {
            let trs = '';
            if (filteredDocs.length > 0) {
                trs = filteredDocs.map(doc => {
                    let adminBtns = '';
                    if (state.userRole === 'admin') {
                        let approveBtn = doc.status !== 'DISETUJUI' ? `<button data-id="${doc.id}" class="btn-approve-doc p-1.5 rounded bg-emerald-500/10 text-emerald-500 hover:bg-emerald-500 hover:text-white" title="Setujui Dokumen"><i class="ph-bold ph-check text-base"></i></button>` : '';
                        adminBtns = `
                            <button data-id="${doc.id}" class="btn-edit-doc p-1.5 rounded bg-amber-500/10 text-amber-500 hover:bg-amber-500 hover:text-white" title="Edit Nama Dokumen"><i class="ph-bold ph-pencil-simple text-base"></i></button>
                            ${approveBtn}
                            <button data-id="${doc.id}" class="btn-delete-doc p-1.5 rounded bg-rose-500/10 text-rose-500 hover:bg-rose-500 hover:text-white" title="Hapus Permanen"><i class="ph-bold ph-trash text-base"></i></button>
                        `;
                    }
                    return `
                        <tr class="border-b border-slate-800/50 hover:bg-slate-800/20 group">
                            <td class="py-4 pl-6 text-sm text-slate-200 font-medium">
                                <div class="flex items-center gap-3"><i class="ph-fill ph-file-pdf text-xl text-rose-400"></i><span class="truncate max-w-[250px]" title="${escapeHTML(doc.name)}">${escapeHTML(doc.name)}</span></div>
                            </td>
                            <td class="py-4 text-sm text-slate-400">${escapeHTML(state.categories.find(c => c.id === doc.categoryId)?.name || '-')}</td>
                            <td class="py-4 pr-4 text-sm text-slate-400">${escapeHTML(doc.size)}</td>
                            <td class="py-4 text-sm">
                                <span class="px-2 py-1 text-[10px] font-bold rounded-full border ${doc.status === 'DISETUJUI' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/20'}">${doc.status || 'MENUNGGU'}</span>
                            </td>
                            <td class="py-4 pr-6 text-right">
                                <div class="flex items-center justify-end gap-2 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity">
                                    <button data-id="${doc.id}" class="btn-preview-doc p-1.5 rounded bg-brand-primary/10 text-brand-primary hover:bg-brand-primary hover:text-white" title="Unduh File Asli"><i class="ph-bold ph-download-simple text-base"></i></button>
                                    ${adminBtns}
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            } else {
                trs = `<tr><td colSpan="5" class="py-12 text-center text-slate-400 text-sm">Tidak ada dokumen di folder ini pada server.</td></tr>`;
            }

            return `
                <div class="bg-brand-panel border border-slate-700/30 rounded-2xl overflow-hidden shadow-sm mt-4">
                    <div class="overflow-x-auto w-full">
                        <table class="w-full text-left border-collapse min-w-[600px]">
                            <thead>
                                <tr class="border-b border-slate-700 bg-slate-800/30">
                                    <th class="py-4 pl-6 text-xs font-bold text-slate-400 uppercase tracking-wider">Nama Dokumen (Server)</th>
                                    <th class="py-4 text-xs font-bold text-slate-400 uppercase tracking-wider">Kategori Laporan</th>
                                    <th class="py-4 text-xs font-bold text-slate-400 uppercase tracking-wider">Ukuran</th>
                                    <th class="py-4 text-xs font-bold text-slate-400 uppercase tracking-wider">Status</th>
                                    <th class="py-4 pr-6 text-xs font-bold text-slate-400 uppercase tracking-wider text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody>${trs}</tbody>
                        </table>
                    </div>
                </div></div> <!-- closes max-w-6xl -->
            `;
        }

        function openModal(type, data = null) {
            state.modalConfig = { type, data };
            els.modalContainer.classList.remove('hidden');
            let content = '';

            // Generate HTML based on Modal Type
            if (type === 'upload') {
                let catOpts = state.categories.map(c => `<option value="${c.id}">${escapeHTML(c.name)}</option>`).join('');
                let vilOpts = state.villages.map(v => `<option value="${v.id}">${escapeHTML(v.name)}</option>`).join('');
                
                content = `
                    <form id="form-upload">
                        <div class="flex items-center gap-3 mb-6">
                            <div class="w-10 h-10 rounded-full bg-brand-primary/20 text-brand-primary flex items-center justify-center shrink-0"><i class="ph-bold ph-cloud-arrow-up text-xl"></i></div>
                            <div><h3 class="text-lg font-bold text-white">Unggah ke Server (Cloud)</h3><p class="text-xs text-slate-400">File akan disimpan permanen.</p></div>
                        </div>
                        <div id="upload-error-box" class="hidden mb-4 p-2.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm flex gap-2"><i class="ph-fill ph-warning-circle"></i> <span id="upload-error-msg"></span></div>
                        <div class="space-y-4 mb-6">
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1.5">Pilih File Fisik (PDF, Excel, dll)</label>
                                <input type="file" id="input-file" class="w-full bg-[#131b2d] border border-slate-700/50 rounded-xl px-4 py-2 text-sm text-slate-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-primary/20 file:text-brand-primary cursor-pointer" required />
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-medium text-slate-400 mb-1.5">Kategori</label>
                                    <select id="input-cat" required class="w-full bg-[#131b2d] border border-slate-700/50 rounded-xl px-3 py-2.5 text-sm text-white focus:border-brand-primary outline-none"><option value="">-- Pilih --</option>${catOpts}</select>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-400 mb-1.5">Desa</label>
                                    <select id="input-vil" required class="w-full bg-[#131b2d] border border-slate-700/50 rounded-xl px-3 py-2.5 text-sm text-white focus:border-brand-primary outline-none"><option value="">-- Pilih --</option>${vilOpts}</select>
                                </div>
                            </div>
                            <div id="upload-progress-container" class="hidden w-full bg-slate-800 rounded-full h-2.5 mt-4">
                                <div id="upload-progress-bar" class="bg-brand-primary h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                                <p id="upload-progress-text" class="text-[10px] text-slate-400 mt-1 text-right">Mengunggah: 0%</p>
                            </div>
                        </div>
                        <div class="flex gap-3">
                            <button type="button" class="btn-close-modal flex-1 py-2.5 rounded-xl border border-slate-700 text-slate-300 hover:bg-slate-800 text-sm font-medium">Batal</button>
                            <button type="submit" id="btn-submit-upload" class="flex-1 py-2.5 rounded-xl bg-brand-primary hover:bg-indigo-500 text-white text-sm font-medium shadow-lg flex justify-center items-center gap-2">Unggah File</button>
                        </div>
                    </form>
                `;
            } else if (type === 'preview_doc') {
                content = `
                    <div class="text-center">
                        <div class="w-16 h-16 rounded-full bg-brand-primary/20 text-brand-primary flex items-center justify-center mx-auto mb-4"><i class="ph-fill ph-file-pdf text-3xl"></i></div>
                        <h3 class="text-lg font-bold text-white mb-1 truncate px-4">${escapeHTML(data.name)}</h3>
                        <p class="text-sm text-slate-400 mb-6">${escapeHTML(data.size)} • Disimpan di Server Cloud</p>
                        <div class="flex gap-3">
                            <button class="btn-close-modal flex-1 py-2.5 rounded-xl border border-slate-700 text-slate-300 hover:bg-slate-800 text-sm font-medium">Tutup</button>
                            <a href="${data.fileUrl}" target="_blank" rel="noopener noreferrer" class="flex-1 py-2.5 rounded-xl bg-brand-primary hover:bg-indigo-500 text-white text-sm font-medium shadow-lg flex items-center justify-center gap-2"><i class="ph-bold ph-download-simple"></i> Unduh Asli</a>
                        </div>
                    </div>
                `;
            } else if (['edit_doc', 'approve_doc', 'delete_doc', 'add_cat', 'edit_cat', 'delete_cat', 'add_village'].includes(type)) {
                // Dynamic Admin Modals
                let title = '', icon = '', color = '', extraHTML = '', requirePass = false, requireInput = false, inputLabel = '', inputVal = '';
                
                if (type === 'edit_doc') {
                    title = 'Edit Nama Dokumen'; icon = 'ph-pencil-simple'; color = 'amber-500'; requirePass = true; requireInput = true; inputLabel = 'Nama Baru'; inputVal = data.name;
                } else if (type === 'approve_doc') {
                    title = 'Setujui Dokumen?'; icon = 'ph-check'; color = 'emerald-500'; requirePass = true; extraHTML = `<p class="text-sm text-slate-400 text-center mb-6 px-2">Dokumen "${escapeHTML(data.name)}" akan ditandai sebagai disetujui.</p>`;
                } else if (type === 'delete_doc') {
                    title = 'Hapus Permanen?'; icon = 'ph-trash'; color = 'rose-500'; requirePass = true; extraHTML = `<p class="text-sm text-slate-400 text-center mb-6 px-2">Dokumen "${escapeHTML(data.name)}" akan dihapus dari server.</p>`;
                } else if (type === 'add_cat') {
                    title = 'Tambah Kategori'; icon = 'ph-plus'; color = 'brand-primary'; requireInput = true; inputLabel = 'Nama Kategori';
                } else if (type === 'edit_cat') {
                    title = 'Edit Kategori'; icon = 'ph-pencil-simple'; color = 'amber-500'; requirePass = true; requireInput = true; inputLabel = 'Nama Kategori'; inputVal = data.name;
                } else if (type === 'delete_cat') {
                    title = 'Hapus Kategori?'; icon = 'ph-trash'; color = 'rose-500'; requirePass = true; extraHTML = `<p class="text-sm text-slate-400 text-center mb-6 px-2">Kategori "${escapeHTML(data.name)}" akan dihapus permanen.</p>`;
                } else if (type === 'add_village') {
                    title = 'Tambah Kampung Baru'; icon = 'ph-house-line'; color = 'brand-primary'; requireInput = true; inputLabel = 'Nama Kampung';
                }

                content = `
                    <form id="form-admin-action">
                        <div class="w-12 h-12 rounded-full bg-${color}/20 text-${color} flex items-center justify-center mx-auto mb-4"><i class="ph-bold ${icon} text-2xl"></i></div>
                        <h3 class="text-lg font-bold text-white text-center mb-2">${title}</h3>
                        ${extraHTML}
                        <div id="modal-error-box" class="hidden mb-4 p-2 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs text-center"></div>
                        <div class="space-y-4 mb-6">
                            ${requireInput ? `<div><label class="block text-xs font-medium text-slate-400 mb-1.5">${inputLabel}</label><input type="text" id="modal-input-text" value="${escapeHTML(inputVal)}" class="w-full bg-[#131b2d] border border-slate-700/50 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-brand-primary" required /></div>` : ''}
                            ${requirePass ? `<div><label class="block text-xs font-medium text-${color} mb-1.5">Password Administrator</label><input type="password" id="modal-input-pass" class="w-full bg-[#131b2d] border border-${color}/30 rounded-xl px-4 py-3 text-sm text-white outline-none" required /></div>` : ''}
                        </div>
                        <div class="flex gap-3">
                            <button type="button" class="btn-close-modal flex-1 py-2.5 rounded-xl border border-slate-700 text-slate-300 hover:bg-slate-800 text-sm font-medium">Batal</button>
                            <button type="submit" id="btn-submit-action" class="flex-1 py-2.5 rounded-xl bg-${color} hover:bg-opacity-80 text-white text-sm font-medium shadow-lg">Simpan</button>
                        </div>
                    </form>
                `;
            }
            
            els.modalContent.innerHTML = content;

            // Bind Modal Forms Dynamically
            const formUpload = document.getElementById('form-upload');
            if (formUpload) formUpload.addEventListener('submit', handleUploadSubmit);

            const formAdmin = document.getElementById('form-admin-action');
            if (formAdmin) formAdmin.addEventListener('submit', handleAdminAction);
        }

        function closeModal() {
            if (state.isUploading) return;
            state.modalConfig = { type: null, data: null };
            els.modalContainer.classList.add('hidden');
            els.modalContent.innerHTML = '';
        }

        async function handleUploadSubmit(e) {
            e.preventDefault();
            const fileInput = document.getElementById('input-file');
            const file = fileInput.files[0];
            const catId = document.getElementById('input-cat').value;
            const vilId = document.getElementById('input-vil').value;
            const errorBox = document.getElementById('upload-error-box');
            const errorMsg = document.getElementById('upload-error-msg');
            const btnSubmit = document.getElementById('btn-submit-upload');

            if (!file || !catId || !vilId) return;
            if (file.size > 524288000) {
                errorMsg.innerText = 'Ukuran file melebihi batas (500 MB)!';
                errorBox.classList.remove('hidden'); return;
            }

            state.isUploading = true;
            btnSubmit.innerHTML = `<i class="ph-bold ph-spinner animate-spin"></i> Proses...`;
            btnSubmit.disabled = true;
            document.querySelectorAll('.btn-close-modal').forEach(b => b.disabled = true);
            
            document.getElementById('upload-progress-container').classList.remove('hidden');
            const progressBar = document.getElementById('upload-progress-bar');
            const progressText = document.getElementById('upload-progress-text');

            try {
                const filePath = `documents/${appId}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
                const storageRef = ref(storage, filePath);
                const uploadTask = uploadBytesResumable(storageRef, file);
                
                uploadTask.on('state_changed', 
                    (snapshot) => {
                        const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                        progressBar.style.width = `${progress}%`;
                        progressText.innerText = `Mengunggah: ${progress}%`;
                    },
                    (error) => {
                        console.error(error);
                        errorMsg.innerText = 'Gagal mengunggah file.';
                        errorBox.classList.remove('hidden');
                        resetUploadUI(btnSubmit);
                    },
                    async () => {
                        const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                        const newDoc = {
                            name: file.name,
                            categoryId: catId,
                            villageId: vilId,
                            size: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
                            status: state.userRole === 'admin' ? 'DISETUJUI' : 'MENUNGGU',
                            fileUrl: downloadURL,
                            fileType: file.type,
                            storagePath: uploadTask.snapshot.ref.fullPath,
                            createdAt: new Date().toISOString()
                        };
                        
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'documents'), newDoc);
                        
                        state.activeMenu = `cv_${catId}_${vilId}`;
                        renderSidebar();
                        renderContent();
                        
                        resetUploadUI(btnSubmit);
                        document.getElementById('form-upload').reset(); // Kosongkan form setelah sukses
                        closeModal();
                    }
                );
            } catch (err) {
                errorMsg.innerText = 'Terjadi kesalahan sistem.';
                errorBox.classList.remove('hidden');
                resetUploadUI(btnSubmit);
            }
        }

        function resetUploadUI(btn) {
            state.isUploading = false;
            btn.innerHTML = 'Unggah File';
            btn.disabled = false;
            document.querySelectorAll('.btn-close-modal').forEach(b => b.disabled = false);
        }

        async function handleAdminAction(e) {
            e.preventDefault();
            const type = state.modalConfig.type;
            const data = state.modalConfig.data;
            const errorBox = document.getElementById('modal-error-box');
            const passInput = document.getElementById('modal-input-pass');
            const textInput = document.getElementById('modal-input-text');
            const btn = document.getElementById('btn-submit-action');
            
            // Password validation for restricted actions
            if (['edit_doc', 'approve_doc', 'delete_doc', 'edit_cat', 'delete_cat'].includes(type)) {
                if (passInput && passInput.value !== ADMIN_PASSWORD) {
                    errorBox.innerText = 'Password Administrator salah!';
                    errorBox.classList.remove('hidden'); return;
                }
            }

            btn.innerHTML = `<i class="ph-bold ph-spinner animate-spin"></i>`;
            btn.disabled = true;

            try {
                if (type === 'edit_doc') {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'documents', data.id);
                    await updateDoc(docRef, { name: textInput.value });
                } else if (type === 'approve_doc') {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'documents', data.id);
                    await updateDoc(docRef, { status: 'DISETUJUI' });
                } else if (type === 'delete_doc') {
                    if (data.storagePath) {
                        const storageRef = ref(storage, data.storagePath);
                        await deleteObject(storageRef).catch(() => console.log('File fisik tidak ditemukan'));
                    }
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'documents', data.id));
                } else if (type === 'add_cat') {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'categories'), { name: textInput.value });
                } else if (type === 'edit_cat') {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'categories', data.id), { name: textInput.value });
                } else if (type === 'delete_cat') {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'categories', data.id));
                    state.activeMenu = 'dashboard';
                } else if (type === 'add_village') {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'villages'), { name: textInput.value });
                }
                closeModal();
            } catch (err) {
                console.error(err);
                errorBox.innerText = 'Gagal menyimpan data ke server.';
                errorBox.classList.remove('hidden');
                btn.innerText = 'Coba Lagi';
                btn.disabled = false;
            }
        }

        // Start App
        window.addEventListener('load', () => {
            // Delay slighty for visual transition
            setTimeout(initApp, 500);
        });
    </script>
</body>
</html>
