                            <div className="fixed top-4 right-4 flex gap-4 no-print z-50">
                                <button onClick={() => setPrintMode(null)} className="px-6 py-2 bg-red-600 text-white font-bold rounded shadow-lg border border-red-700">Tutup Cetak</button>
                                <button onClick={() => window.print()} className="px-6 py-2 bg-blue-600 text-white font-bold rounded shadow-lg border border-blue-700">Cetak Sekarang</button>
                            </div>
                        </div>
                    )}
                </>
            );
        };

        const MainApp = () => {
            const [user, setUser] = useState(null);

            return !user ? (
                <LoginScreen onLogin={(role, name) => setUser({ role, name })} />
            ) : (
                <DashboardApp onLogout={() => setUser(null)} userRole={user.role} userName={user.name} />
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
</body>
</html>
