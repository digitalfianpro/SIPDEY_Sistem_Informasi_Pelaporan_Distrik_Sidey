    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const defaultConfig = {
            apiKey: "AIzaSyC-WGTJMVkl6T7mnv5gUBP73_HuleP1zC8",
            authDomain: "sipda-2026.firebaseapp.com",
            projectId: "sipda-2026",
            storageBucket: "sipda-2026.firebasestorage.app",
            messagingSenderId: "246915937648",
            appId: "1:246915937648:web:f5b24451212a95f4d70bb5",
            measurementId: "G-5T4ZRKDFMZ"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : defaultConfig;
        const appId = typeof __app_id !== 'undefined' ? __app_id : "sipda-2026";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);
        const ADMIN_PASSWORD = 'sidey2026';

        // Initial Data Configurations
        const INITIAL_CATEGORIES = [
            { name: 'RKPK / APBK' }, { name: 'Data Perangkat Kampung' },
            { name: 'Data Perangkat Bamuskam' }, { name: 'Pelaporan Dana Desa' },
            { name: 'Data Nominatif Kampung' }
        ];

        const DEFAULT_VILLAGES = [
            { name: "Kaironi" }, { name: "Kasi" }, { name: "Manggupi" },
            { name: "Meyof 1" }, { name: "Saray" }, { name: "Sidey" },
            { name: "Sidey Baru" }, { name: "Sidey Jaya" }, { name: "Sidey Makmur" },
            { name: "Waramui" }, { name: "Wariki" }, { name: "Womnowi" }
        ];

        // Application State
        const state = {
            userRole: null, // 'admin' or 'umum'
            userName: '',
            loginMode: 'umum',
            activeMenu: 'dashboard', // dashboard, rekapan, c_{id}, v_{id}, cv_{catId}_{vilId}
            categories: [],
            villages: [],
            docs: [],
            searchTerm: '',
            isKampungExpanded: true,
            isLightMode: false,
            modalConfig: null,
            printConfig: JSON.parse(localStorage.getItem('sip_print_config')) || {
                kabupaten: 'KABUPATEN MANOKWARI',
                instansi: 'DISTRIK SIDEY',
                alamat: 'Jalan Raya Sidey, Distrik Sidey, Kabupaten Manokwari, Papua Barat',
                kepala: 'NAMA KEPALA DISTRIK, S.STP., M.Si',
                nip: '19800101 200501 1 001',
                logo: 'https://i.ibb.co.com/DP0G84Qm/Chat-GPT-Image-Jul-27-2026-05-10-28-PM.png',
                logoSize: 96,
                logoOffset: 0
            }
        };

        // Utility: Escape HTML to prevent XSS
        const escapeHTML = (str) => {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        };

        // DOM Elements
        const els = {
            loading: document.getElementById('loading-screen'),
            login: document.getElementById('login-screen'),
            dashboard: document.getElementById('dashboard-screen'),
            
            // Login
            tabUmum: document.getElementById('tab-login-umum'),
            tabAdmin: document.getElementById('tab-login-admin'),
            loginError: document.getElementById('login-error'),
            loginForm: document.getElementById('login-form'),
            loginLabelUser: document.getElementById('login-label-username'),
            loginInputUser: document.getElementById('login-input-username'),
            loginPassContainer: document.getElementById('login-password-container'),
            loginInputPass: document.getElementById('login-input-password'),
            loginSubmitBtn: document.getElementById('login-submit-btn'),

            // Sidebar & Main
            sidebar: document.getElementById('sidebar'),
            mobileOverlay: document.getElementById('mobile-overlay'),
            btnCloseSidebar: document.getElementById('btn-close-sidebar'),
            btnMobileMenu: document.getElementById('btn-mobile-menu'),
            sidebarCats: document.getElementById('sidebar-categories'),
            sidebarVils: document.getElementById('sidebar-villages'),
            btnToggleKampung: document.getElementById('btn-toggle-kampung'),
            kampungToggleIcon: document.getElementById('kampung-toggle-icon'),
            kampungCountLabel: document.getElementById('kampung-count-label'),
            btnAddCat: document.getElementById('btn-add-cat'),
            btnAddVil: document.getElementById('btn-add-vil'),
            btnLogout: document.getElementById('btn-logout'),

            // Content
            contentArea: document.getElementById('content-area'),
            searchInput: document.getElementById('search-input'),
            btnRefresh: document.getElementById('btn-refresh'),
            btnThemeToggle: document.getElementById('btn-theme-toggle'),
            themeIcon: document.getElementById('theme-icon'),

            // Toast Progress
            uploadToast: document.getElementById('upload-toast'),
            toastFilename: document.getElementById('toast-filename'),
            toastStatus: document.getElementById('toast-status'),
            toastPercentage: document.getElementById('toast-percentage'),
            toastProgressBar: document.getElementById('toast-progress-bar'),
            toastIcon: document.getElementById('toast-icon'),

            // Modal
            modalContainer: document.getElementById('modal-container'),
            modalContent: document.getElementById('modal-content')
        };

        async function initApp() {
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.warn("Auth error (melanjutkan tanpa auth):", e);
            }
            
            setupFirebaseListeners();
            
            // Check session
            const savedRole = sessionStorage.getItem('loggedRole');
            const savedName = sessionStorage.getItem('loggedUserName');
            if (savedRole) {
                doLogin(savedRole, savedName || '');
                els.loading.classList.add('hidden');
            } else {
                els.loading.classList.add('hidden');
                els.login.classList.remove('hidden');
                els.login.classList.add('flex');
            }
        }

        function setupFirebaseListeners() {
            // Categories
            const catRef = collection(db, 'artifacts', appId, 'public', 'data', 'categories');
            onSnapshot(catRef, (snapshot) => {
                if (snapshot.empty && state.categories.length === 0) {
                    INITIAL_CATEGORIES.forEach(c => addDoc(catRef, c).catch(e => console.error(e)));
                } else {
                    state.categories = [];
                    snapshot.forEach(doc => state.categories.push({ id: doc.id, ...doc.data() }));
                    state.categories.sort((a, b) => a.name.localeCompare(b.name));
                    if (state.userRole) { renderSidebar(); renderContent(); }
                }
            }, (error) => console.error("Category listener error:", error));

            // Villages
            const vilRef = collection(db, 'artifacts', appId, 'public', 'data', 'villages');
            onSnapshot(vilRef, (snapshot) => {
                if (snapshot.empty && state.villages.length === 0) {
                    DEFAULT_VILLAGES.forEach(v => addDoc(vilRef, v).catch(e => console.error(e)));
                } else {
                    state.villages = [];
                    snapshot.forEach(doc => state.villages.push({ id: doc.id, ...doc.data() }));
                    state.villages.sort((a, b) => a.name.localeCompare(b.name));
                    if (state.userRole) { renderSidebar(); renderContent(); }
                }
            }, (error) => console.error("Village listener error:", error));

            // Real-time Documents Listener (Seamless Sync between Public & Admin)
            const docsRef = collection(db, 'artifacts', appId, 'public', 'data', 'documents');
            onSnapshot(docsRef, (snapshot) => {
                state.docs = [];
                snapshot.forEach(doc => state.docs.push({ id: doc.id, ...doc.data() }));
                
                // Helper to safely extract milliseconds from Firebase timestamp or pending local write
                const getMs = (d) => {
                    if (!d.timestamp) return Date.now();
                    if (d.timestamp.seconds) return d.timestamp.seconds * 1000;
                    if (d.timestamp.toDate) return d.timestamp.toDate().getTime();
                    return Date.now();
                };

                // Sort by timestamp descending
                state.docs.sort((a, b) => getMs(b) - getMs(a));
                
                if (state.userRole) { renderContent(); }
            }, (error) => console.error("Documents realtime sync error:", error));
        }

            const btnEditPrint = e.target.closest('#btn-edit-print');

                e.preventDefault();
                openModal('edit_print');
                return;
            }

            if (e.target.closest('#btn-add-cat')) openModal('add_cat');
            if (e.target.closest('#btn-add-vil')) openModal('add_village');

            const printBtn = e.target.closest('#btn-print-rekapan');
            if (printBtn) { e.preventDefault(); window.print(); }

            if (editCatBtn) { e.stopPropagation(); openModal('edit_cat', { id: editCatBtn.dataset.id, name: editCatBtn.dataset.name }); }

                const parts = state.activeMenu.split('_');

            } else if (type === 'delete_doc' || type === 'delete_cat') {

                const formAddVil = document.getElementById('form-add-vil');

        function closeModal() {
            els.modalContainer.classList.add('hidden');
            els.modalContent.innerHTML = '';
            state.modalConfig = null;
        }

        async function compressImage(file) {
            if (!file.type.startsWith('image/')) return file; // Skip PDF or non-images
            
            return new Promise((resolve) => {
                const img = new Image();
                // Menggunakan URL.createObjectURL jauh lebih cepat dan hemat memori dibanding FileReader
                const objectUrl = URL.createObjectURL(file);
                
                img.onload = () => {
                    URL.revokeObjectURL(objectUrl); // Bersihkan memori setelah gambar dimuat
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1280;
                    const MAX_HEIGHT = 1280;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob((blob) => {
                        if (blob) {
                            // Kompresi ke 60% quality JPEG untuk ukuran lebih kecil dan upload super cepat
                            const newFile = new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() });
                            resolve(newFile);
                        } else {
                            resolve(file); // Fallback jika toBlob gagal
                        }
                    }, 'image/jpeg', 0.6);
                };
                
                img.onerror = () => {
                    URL.revokeObjectURL(objectUrl);
                    resolve(file); // Fallback jika gambar gagal dimuat
                };
                
                img.src = objectUrl;
            });
        }

        async function handleFastUpload(e) {
            e.preventDefault();
            const fileInput = document.getElementById('upload-file');
            const fileOriginal = fileInput.files[0];
            const catId = document.getElementById('upload-cat').value;
            const vilId = document.getElementById('upload-vil').value;
            const errorContainer = document.getElementById('upload-error');

            if (!fileOriginal) return;

            // Validasi ukuran maksimal file (400 MB)
            const maxSizeInBytes = 400 * 1024 * 1024; // 400 MB
            if (fileOriginal.size > maxSizeInBytes) {
                if (errorContainer) {
                    errorContainer.innerText = 'Gagal: Ukuran file melebihi batas maksimal 400 MB.';
                    errorContainer.classList.remove('hidden');
                }
                return;
            }

            // Instantly close modal so user is not blocked
            closeModal();

            // Prepare Toast UI
            els.uploadToast.classList.remove('hidden');
            els.toastFilename.innerText = fileOriginal.name;
            els.toastStatus.innerText = 'Mengoptimalkan file...';
            els.toastPercentage.innerText = '0%';
            els.toastProgressBar.style.width = '0%';
            els.toastIcon.className = 'ph-bold ph-spinner animate-spin text-lg';

            try {
                // Compress image if applicable (fast processing)
                const file = await compressImage(fileOriginal);
                els.toastStatus.innerText = 'Mengunggah ke Cloud...';

                // Setup Firebase Storage
                const storagePath = `artifacts/${appId}/public/data/documents/${Date.now()}_${file.name}`;
                const storageRef = ref(storage, storagePath);
                
                // Start Resumable Upload
                const uploadTask = uploadBytesResumable(storageRef, file);

                uploadTask.on('state_changed', 
                    (snapshot) => {
                        const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                        els.toastPercentage.innerText = progress + '%';
                        els.toastProgressBar.style.width = progress + '%';
                    }, 
                    (error) => {
                        console.error("Upload error:", error);
                        els.toastStatus.innerText = 'Gagal mengunggah!';
                        els.toastIcon.className = 'ph-bold ph-x-circle text-rose-500 text-lg';
                        setTimeout(() => els.uploadToast.classList.add('hidden'), 3000);
                    }, 
                    async () => {
                        // Upload completed successfully
                        els.toastStatus.innerText = 'Menyimpan data...';
                        els.toastPercentage.innerText = '100%';
                        els.toastProgressBar.style.width = '100%';
                        
                        const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                        
                        // Save document reference to Firestore
                        const docData = {
                            name: file.name,
                            categoryId: catId,
                            villageId: vilId,
                            url: downloadURL,
                            path: storagePath,
                            type: file.type,
                            size: file.size,
                            status: 'MENUNGGU',
                            uploadedBy: state.userName || (state.userRole === 'admin' ? 'Administrator' : 'Masyarakat/Umum'),
                            uploaderRole: state.userRole || 'umum',
                            timestamp: serverTimestamp()
                        };

                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'documents'), docData);
                        
                        // Show success state on toast briefly
                        els.toastIcon.className = 'ph-bold ph-check-circle text-emerald-400 text-lg';
                        els.toastStatus.innerText = 'Selesai diunggah!';
                        els.toastFilename.innerText = 'Berhasil';
                        
                        setTimeout(() => {
                            els.uploadToast.classList.add('hidden');
                        }, 2500);
                    }
                );
            } catch (error) {
                console.error("Fast upload error:", error);
                els.toastStatus.innerText = 'Terjadi kesalahan sistem.';
                setTimeout(() => els.uploadToast.classList.add('hidden'), 3000);
            }
        }

        async function handleAddCategory(e) {
            e.preventDefault();
            const name = document.getElementById('cat-name').value.trim();
            if (name) {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'categories'), { name });

        async function handleAddVillage(e) {
            e.preventDefault();
            const name = document.getElementById('vil-name').value.trim();
            if (name) {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'villages'), { name });
                closeModal();
            }
        }

        async function doDeleteDoc(docData) {
            try {
                if (docData.path) {
                    const fileRef = ref(storage, docData.path);
                    await deleteObject(fileRef).catch(e => console.log('File not found in storage, but deleting doc anyway', e));
                }
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'documents', docData.id));
            } catch (e) {
                console.error("Delete doc error", e);
            }
        }

        async function doDeleteCat(catId) {
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'categories', catId));
                if (state.activeMenu === 'c_' + catId) state.activeMenu = 'dashboard';
            } catch (e) {
                console.error(e);
            }
        }

        async function handleApproveDoc(docId) {
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'documents', docId), {
                    status: 'DISETUJUI'
                });
            } catch (e) {
                console.error("Approve error", e);
            }
        }

        window.addEventListener('DOMContentLoaded', initApp);
